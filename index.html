<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flowdeck — Work Planner & Custom Dashboard</title>
<meta name="description" content="Plan your work, track progress and build your own dashboard. Kanban, week planner, calendar, timeline, focus timer, habits and goals in one page.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%237c5cff'/><path d='M8 10h16M8 16h10M8 22h6' stroke='white' stroke-width='3' stroke-linecap='round'/></svg>">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="app">
  <aside class="side" id="side"></aside>
  <main class="main">
    <header class="top">
      <button class="icon-btn menu-toggle" data-act="menu" aria-label="Menu"><svg class="svg" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <div style="min-width:0"><h1 id="vtitle">Dashboard</h1><div class="sub" id="vsub"></div></div>
      <div class="spacer"></div>
      <button class="search-btn" data-act="palette"><svg class="svg" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span class="lbl">Search or run a command…</span><span class="kbd" style="margin-left:auto">Ctrl K</span></button>
      <button class="icon-btn" data-act="theme" title="Toggle theme (T)"><svg class="svg" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
      <button class="btn primary" data-act="newTask"><svg class="svg" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span class="hide-sm">New task</span></button>
    </header>
    <div class="content" id="content"></div>
  </main>
</div>
<div class="overlay" id="overlay"></div>
<div class="toasts" id="toasts"></div>

<script src="js/engine-wasm.js"></script>
<script src="js/engine.js"></script>
<script src="js/app.js"></script>
</body>
</html>
